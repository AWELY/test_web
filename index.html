<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LCL Tournament Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="overlay"></div>

    <div class="main-wrapper">
      <header>
        <h1 class="main-title">LCL <span>CHAMPIONSHIP</span></h1>
      </header>

      <div class="content-grid">
        <section class="card registration-section">
          <h3 class="card-title">add</h3>
          <form id="registrationForm">
            <div class="input-group">
              <label>Riot ID</label>
              <input type="text" id="riotId" placeholder="Name #TAG" required />
            </div>

            <div class="input-group">
              <label>Rank</label>
              <select id="rank">
                <option value="1">Iron</option>
                <option value="2">Bronze</option>
                <option value="3">Silver</option>
                <option value="4">Gold</option>
                <option value="5">Platinum</option>
                <option value="6">Emerald</option>
                <option value="7">Diamond</option>
                <option value="10">Master+</option>
              </select>
            </div>

            <div class="roles-grid">
              <div class="input-group">
                <label>المركز الأساسي</label>
                <select id="mainRole">
                  <option value="TOP">TOP</option>
                  <option value="JNG">JNG</option>
                  <option value="MID">MID</option>
                  <option value="ADC">ADC</option>
                  <option value="SUP">SUP</option>
                </select>
              </div>
              <div class="input-group">
                <label>المركز الثاني</label>
                <select id="subRole">
                  <option value="TOP">TOP</option>
                  <option value="JNG">JNG</option>
                  <option value="MID">MID</option>
                  <option value="ADC">ADC</option>
                  <option value="SUP">SUP</option>
                  <option value="Fill">Fill</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn-glow">add to the list</button>
          </form>
        </section>

        <section class="card list-section">
          <h3 class="card-title">players (<span id="playerCount">0</span>)</h3>
          <div class="table-scroll">
            <table id="playersTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>الرانك</th>
                  <th>المراكز</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <button id="balanceBtn" class="btn-gold">start the battle</button>
        </section>
      </div>

      <div id="teamsResult" class="teams-grid"></div>

      <section
        id="bracketSection"
        class="card bracket-section"
        style="display: none"
      >
        <h3 class="card-title">the map</h3>
        <div class="bracket-container" id="bracketDisplay"></div>
      </section>
    </div>

    <script src="h.js"></script>
  </body>
</html>
